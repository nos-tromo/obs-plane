version: 2
updates:
  # No `docker` ecosystem block — obs-plane is pull-only (Prometheus, Grafana,
  # Loki, Alloy and the exporters are digest-pinned images referenced by
  # compose). It has no Dockerfiles for dependabot to update, and the
  # ecosystem fails the run when it finds nothing.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
