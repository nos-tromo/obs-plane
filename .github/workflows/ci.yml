name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    # Shared infra checks (yamllint, shellcheck, hadolint, make/common.mk +
    # bundle-lib.sh drift-check) incl. bundle-lib drift-check (same as data-plane).
    #
    # compose-files is deliberately omitted: the reusable workflow's
    # compose-config sub-job stubs only NEO4J_PASSWORD/OPENAI_API_KEY (written
    # for data-plane/vllm-service), not this repo's required
    # GRAFANA_ADMIN_PASSWORD, so it would fail `docker compose config` here.
    # Compose validation is done ourselves below in validate-configs, seeded
    # from .env.example (which does supply GRAFANA_ADMIN_PASSWORD).
    uses: nos-tromo/.github/.github/workflows/infra-validation.yml@862094798ffb1a50433db7fa8759cca1f54c4dc4 # v3.12
    with:
      shell-scripts-glob: 'scripts/*.sh'

  validate-configs:
    # Validate every service config with the exact pinned images that will run it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: docker compose config
        # Validated with and without --profile gpu: compose skips
        # profile-gated services (dcgm-exporter) unless the profile is active,
        # so the profile-off runs alone would never parse that service block.
        run: |
          cp .env.example .env
          docker compose --env-file .env -f docker/compose.yaml config --quiet
          docker compose -f docker/compose.yaml -f docker/compose.override.yaml --env-file .env config --quiet
          docker compose --env-file .env --profile gpu -f docker/compose.yaml config --quiet
          docker compose --profile gpu -f docker/compose.yaml -f docker/compose.override.yaml --env-file .env config --quiet
      - name: promtool check config + rules
        run: |
          docker run --rm -v "$PWD/prometheus:/etc/prometheus:ro" --entrypoint promtool \
            docker.io/prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893 \
            check config /etc/prometheus/prometheus.yml
      - name: loki verify-config
        run: |
          docker run --rm -v "$PWD/loki/loki.yaml:/etc/loki/loki.yaml:ro" \
            docker.io/grafana/loki:3.7.4@sha256:87f0a067673756a3cede1bcbf0c74875f7df9b09fddb53e399d0c576f756cfcc \
            -config.file=/etc/loki/loki.yaml -config.expand-env=true -verify-config
      - name: loki rules check
        # -verify-config only validates loki.yaml's own schema — it does not
        # load loki/rules/*.yml, so a broken LogQL expr in an alert rule
        # passes "loki verify-config" above and only surfaces at runtime. No
        # lokitool binary ships in the pinned loki image (checked: no /bin/sh,
        # no /usr/bin/lokitool), so this does a real runtime-load check: start
        # loki with the rules mounted the same way docker/compose.yaml does
        # (loki/rules -> /loki/rules/fake, read-only), then assert the ruler
        # actually loaded them via its /loki/api/v1/rules API. A rule file
        # that fails to parse makes the ruler log "unable to list rules" and
        # that namespace's groups never appear (API returns non-200 for that
        # tenant), so checking for HTTP 200 + the known alert name is
        # sufficient to catch a broken expr.
        run: |
          docker run -d --name loki-rules-check -p 3100:3100 \
            -v "$PWD/loki/loki.yaml:/etc/loki/loki.yaml:ro" \
            -v "$PWD/loki/rules:/loki/rules/fake:ro" \
            docker.io/grafana/loki:3.7.4@sha256:87f0a067673756a3cede1bcbf0c74875f7df9b09fddb53e399d0c576f756cfcc \
            -config.file=/etc/loki/loki.yaml -config.expand-env=true

          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/loki-rules.json -w '%{http_code}' http://localhost:3100/loki/api/v1/rules || echo 000)
            [ "$code" = "200" ] && break
            sleep 1
          done

          echo "loki /loki/api/v1/rules -> HTTP $code"
          cat /tmp/loki-rules.json || true

          if [ "$code" != "200" ]; then
            echo "loki rules failed to load (see ruler error above / docker logs below)"
            docker logs loki-rules-check
            docker rm -f loki-rules-check
            exit 1
          fi

          if ! grep -q "ErrorLogSpike" /tmp/loki-rules.json; then
            echo "expected alert rule ErrorLogSpike not found in loaded rules"
            docker logs loki-rules-check
            docker rm -f loki-rules-check
            exit 1
          fi

          echo "loki rules loaded OK: ErrorLogSpike present"
          docker rm -f loki-rules-check
      - name: alloy fmt (parse check)
        run: |
          docker run --rm -v "$PWD/alloy/config.alloy:/cfg/config.alloy:ro" \
            docker.io/grafana/alloy:v1.18.0@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308 \
            fmt /cfg/config.alloy > /dev/null
      - name: blackbox config check
        run: |
          docker run --rm -v "$PWD/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro" --entrypoint /bin/blackbox_exporter \
            docker.io/prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc \
            --config.file=/etc/blackbox/blackbox.yml --config.check
      - name: dashboards are valid JSON
        run: |
          for f in grafana/dashboards/*.json; do python3 -m json.tool "$f" > /dev/null; done
      - name: dcgm counters cover rules + dashboard
        # dcgm/counters.csv has no upstream validator (a typo'd field only
        # surfaces at runtime on a GPU host), so at least assert every
        # DCGM field referenced by the alert rules and the GPU dashboard is
        # an uncommented entry in the committed collector list.
        run: |
          fields=$(grep -ohE 'DCGM_FI_[A-Z0-9_]+' prometheus/rules.yml grafana/dashboards/gpu.json | sort -u)
          for f in $fields; do
            grep -qE "^${f}[, ]" dcgm/counters.csv \
              || { echo "field $f referenced but not collected in dcgm/counters.csv"; exit 1; }
          done
          echo "all referenced DCGM fields collected: $fields"
