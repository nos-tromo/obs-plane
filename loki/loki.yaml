auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# The default 15s holds /ready at 503 after its first call, giving other
# ring members time to see this one during a rolling update. A single
# instance has no other members, and nothing polls /ready from start-up
# (the image has no shell for a healthcheck), so the first `make health`
# after every start failed.
ingester:
  lifecycler:
    min_ready_duration: 0s

limits_config:
  retention_period: ${LOKI_RETENTION:-720h}

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/ruler-tmp
  enable_api: true

analytics:
  reporting_enabled: false
