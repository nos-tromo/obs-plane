# loki-audit — the audit lane's own store (docs/audit.md). Derived from
# loki.yaml; it differs in three ways: retention is AUDIT_RETENTION
# (default one year), lines cannot be deleted through the API (only the
# compactor's retention removes them), and there are no rules — alerts on
# the trail come from the verifier's metrics in Prometheus.
auth_enabled: false

server:
  http_listen_port: 3100

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  retention_period: ${AUDIT_RETENTION:-8760h}
  # Also makes every query log a "deletion is not available" warning and
  # error (cache generation lookup); Alloy does not collect this service's
  # logs, so they stay in `make logs S=loki-audit`.
  deletion_mode: disabled

ruler:
  enable_api: false

analytics:
  reporting_enabled: false
