### obs-plane compose — observability for the nos-tromo federation.
###
### What this project owns:
###   - Prometheus (metrics), Loki (logs), Grafana (UI) + their named volumes
###   - Collectors: Alloy (logs), node-exporter, cAdvisor, blackbox-exporter,
###     dcgm-exporter (NVIDIA GPU metrics; `gpu` compose profile only)
###   - The audit lane (docs/audit.md): loki-audit, grafana-audit and
###     audit-verifier + their named volumes
###
### What it does NOT own:
###   - inference-net / data-net (external; joined read-only as a scraper)
###   - Any service other members depend on — obs-plane is a pure consumer.
###
### Airgap: all images pulled + digest-pinned; every phone-home/update-check
### is disabled below. Nothing fetches anything at runtime.

name: obs-plane

x-logging: &default-logging
  driver: "local"
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"

##########################################################
# Shared hardening (deploy ADR 0001) — no privilege
# escalation, all capabilities dropped. cAdvisor is the
# one deliberate exception (privileged; see its comment
# and docs/hardening.md).
##########################################################
x-hardened: &hardened
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

networks:
  default:
  # The audit store's write side: loki-audit with its only writer (alloy)
  # and its read proxy. Nothing else can reach loki-audit.
  audit:
    internal: true
  # The audit store's read side: loki-audit-read (GET on Loki's read API
  # only) with its two readers, grafana-audit and audit-verifier.
  audit-read:
    internal: true
  inference-net:
    external: true
    name: ${INFERENCE_NET:-inference-net}
  data-net:
    external: true
    name: ${DATA_NET:-data-net}
  edge-net:
    external: true
    name: ${EDGE_NET:-edge-net}

services:
  ##########################################################
  # Prometheus — metrics store + scraper
  ##########################################################
  prometheus:
    <<: *hardened
    image: docker.io/prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    networks:
      default:
      inference-net:
      data-net:
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  ##########################################################
  # Grafana — UI; everything provisioned from files
  ##########################################################
  grafana:
    <<: *hardened
    image: docker.io/grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    logging: *default-logging
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      # Airgap: no phone-home, no update checks, no news feed.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Served under /grafana/ behind the edge gateway (edge-plane).
      GF_SERVER_ROOT_URL: "https://${EDGE_HOST:-localhost}/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Loopback only: grafana-guard owns :3000 in this network namespace
      # and is the only thing that can reach Grafana.
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3001"
      # Identity comes from the gateway's trusted header (Authelia
      # forward-auth), accepted only from the guard. Login form stays
      # enabled for the dev-override/tunnel path (admin).
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: "X-Auth-User"
      GF_AUTH_PROXY_HEADER_PROPERTY: "username"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_WHITELIST: 127.0.0.1
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: ${GRAFANA_VIEWER_ROLE:-Viewer}
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      default:
      edge-net:
        aliases: [grafana]
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  ##########################################################
  # grafana-guard — the only listener on :3000 in grafana's
  # network namespace (network_mode below), so it answers for
  # the `grafana` alias on edge-net, for prometheus and for the
  # dev host port. Grafana trusts X-Auth-User but cannot check
  # who sent it; this nginx passes the identity headers on only
  # when X-Edge-Secret equals GRAFANA_EDGE_SECRET, the value the
  # edge gateway sends. Unset secret: headers pass as before.
  # Config: nginx/grafana-guard.conf.template.
  ##########################################################
  grafana-guard:
    <<: *hardened
    image: docker.io/nginxinc/nginx-unprivileged:1.31-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
    logging: *default-logging
    network_mode: "service:grafana"
    # nginx (unprivileged image, uid 101) writes pid/temp under /tmp; the
    # entrypoint renders the template into /etc/nginx/conf.d at startup
    # (mode=1777: the tmpfs shadows the image dir root-owned).
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /etc/nginx/conf.d:size=1m,mode=1777
    environment:
      # Always defined (possibly empty): envsubst leaves an undefined
      # variable's ${...} literally in the config.
      EDGE_SECRET: ${GRAFANA_EDGE_SECRET:-}
      EDGE_SECRET_REQUIRED: "0"
    volumes:
      - ../nginx/grafana-guard.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../scripts/edge_secret_check.sh:/docker-entrypoint.d/05-edge-secret-check.sh:ro
    depends_on:
      - grafana
    restart: unless-stopped

  ##########################################################
  # Loki — log store (single-binary, filesystem backend)
  ##########################################################
  loki:
    <<: *hardened
    image: docker.io/grafana/loki:3.7.4@sha256:87f0a067673756a3cede1bcbf0c74875f7df9b09fddb53e399d0c576f756cfcc
    logging: *default-logging
    command:
      - -config.file=/etc/loki/loki.yaml
      - -config.expand-env=true
    environment:
      LOKI_RETENTION: ${LOKI_RETENTION:-720h}
    volumes:
      - ../loki/loki.yaml:/etc/loki/loki.yaml:ro
      - ../loki/rules:/loki/rules/fake:ro
      - loki-data:/loki
    # The loki image may ship no wget/curl (qdrant precedent) — external
    # readiness is asserted by `make health` via the prometheus container.
    restart: unless-stopped

  ##########################################################
  # socket-proxy — restricted, read-only gateway to the Docker API
  # for Alloy's container discovery + log streaming. The raw socket
  # never enters the Alloy container anymore (deploy ADR 0001); only
  # the GET endpoints Alloy needs are enabled — every mutating and
  # sensitive endpoint (exec, build, volumes, images, POST anything)
  # stays denied. Joins only the project-internal network.
  ##########################################################
  socket-proxy:
    <<: *hardened
    image: lscr.io/linuxserver/socket-proxy:3.4.3-r0-ls91@sha256:a6b52255f881951c3cb6b6cce78c3d91435ed201cf16ab77bfe92e9a8ee13121
    logging: *default-logging
    environment:
      - CONTAINERS=1   # GET /containers/* incl. /logs (discovery + tailing)
      - EVENTS=1       # container lifecycle stream (discovery refresh)
      - NETWORKS=1     # GET /networks — discovery.docker computes network labels
      - PING=1
      # everything else defaults to 0 / denied
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    read_only: true
    tmpfs:
      - /run
    networks:
      default:
    restart: unless-stopped

  ##########################################################
  # Alloy — ships every container's logs to Loki via the Docker API
  # (works with the fleet-wide `local` log driver; no driver changes),
  # reached through socket-proxy above rather than a socket mount.
  ##########################################################
  alloy:
    <<: *hardened
    image: docker.io/grafana/alloy:v1.18.0@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308
    logging: *default-logging
    # The image starts as root only to be able to write its own dirs
    # (mode 770, owned by the internal `alloy` user — unreachable for
    # root once DAC_OVERRIDE is dropped). Run as that user directly;
    # the alloy-data volume must be owned by 473:473 (make volumes
    # chowns it on creation; runbook covers existing hosts).
    user: "473:473"
    command:
      - run
      - /etc/alloy/config.alloy
      - --disable-reporting
      - --storage.path=/var/lib/alloy/data
      # Alloy's HTTP server (metrics + UI) defaults to loopback-only; bind
      # all interfaces on the project-internal network so prometheus can scrape it.
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ../alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    networks:
      default:
      audit:
    depends_on:
      - loki
      - loki-audit
      - socket-proxy
    restart: unless-stopped

  ##########################################################
  # node-exporter — host metrics
  ##########################################################
  node-exporter:
    <<: *hardened
    image: docker.io/prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    logging: *default-logging
    read_only: true
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      # rslave keeps post-boot mounts visible to node_filesystem_* metrics
      - /:/host:ro,rslave
    restart: unless-stopped

  ##########################################################
  # cAdvisor — per-container metrics for the whole host
  ##########################################################
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5@sha256:763aecf1c32c2be8a1a75f9abfc2fc461005c9dbbaa39cb356b354aac1296dbe
    logging: *default-logging
    # cAdvisor's documented requirement for full per-container stats; the
    # largest capability grant in this stack, accepted deliberately.
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    restart: unless-stopped

  ##########################################################
  # blackbox-exporter — HTTP health probes of federation endpoints
  ##########################################################
  blackbox-exporter:
    <<: *hardened
    image: docker.io/prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    logging: *default-logging
    read_only: true
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ../blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      default:
      inference-net:
      data-net:
    restart: unless-stopped

  ##########################################################
  # dcgm-exporter — NVIDIA GPU metrics. Gated behind the `gpu`
  # compose profile: set COMPOSE_PROFILES=gpu in .env on GPU hosts
  # (requires nvidia-container-toolkit); non-GPU hosts never start it
  # and its scrape target reads down (expected — see prometheus.yml).
  # Runs hardened, WITHOUT SYS_ADMIN: DCP profiling metrics
  # (DCGM_FI_PROF_*) are deliberately unavailable; the collected set
  # is pinned by ../dcgm/counters.csv (the image default comments out
  # the ECC counters our alerts need).
  ##########################################################
  dcgm-exporter:
    <<: *hardened
    image: nvcr.io/nvidia/k8s/dcgm-exporter:4.6.0-4.8.3-distroless@sha256:613ab03c11d442fd960ff515f547e9921537454a712d08160bc8f677f89f1c35
    logging: *default-logging
    profiles: ["gpu"]
    read_only: true
    tmpfs:
      - /tmp
      - /run
    command:
      - -f
      - /etc/dcgm-exporter/counters.csv
    volumes:
      - ../dcgm/counters.csv:/etc/dcgm-exporter/counters.csv:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  ##########################################################
  # Audit lane (docs/audit.md). Alloy routes audit records here
  # instead of to the ops Loki: a separate store with its own
  # retention, readers (grafana-audit behind its guard, for the
  # gateway's `audit` group) and integrity checks (audit-verifier).
  # Only alloy writes to loki-audit; readers go through
  # loki-audit-read, which allows reads and nothing else.
  ##########################################################
  loki-audit:
    <<: *hardened
    image: docker.io/grafana/loki:3.7.4@sha256:87f0a067673756a3cede1bcbf0c74875f7df9b09fddb53e399d0c576f756cfcc
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp
    command:
      - -config.file=/etc/loki/loki.yaml
      - -config.expand-env=true
    environment:
      AUDIT_RETENTION: ${AUDIT_RETENTION:-8760h}
    volumes:
      - ../loki/loki-audit.yaml:/etc/loki/loki.yaml:ro
      - loki-audit-data:/loki
    networks:
      audit:
    restart: unless-stopped

  # The readers' only way into loki-audit: GET/HEAD on Loki's read API,
  # 403 for everything else (push, delete, flush, admin endpoints).
  # Config: nginx/loki-audit-read.conf.template.
  loki-audit-read:
    <<: *hardened
    image: docker.io/nginxinc/nginx-unprivileged:1.31-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
    logging: *default-logging
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /etc/nginx/conf.d:size=1m,mode=1777
    volumes:
      - ../nginx/loki-audit-read.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      audit:
      audit-read:
    depends_on:
      - loki-audit
    restart: unless-stopped

  grafana-audit:
    <<: *hardened
    image: docker.io/grafana/grafana-oss:13.0.2@sha256:5dad0df181cb644a14e13617b913b261a54f7d4fd4510721dba420929f35bea2
    logging: *default-logging
    environment:
      # No local admin, no password login: everything is provisioned from
      # files, and readers only ever arrive through the gateway.
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      # Airgap: no phone-home, no update checks, no news feed.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Served under /audit/ behind the edge gateway, which admits only
      # its `audit` group (edge-plane).
      GF_SERVER_ROOT_URL: "https://${EDGE_HOST:-localhost}/audit/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      # Loopback only: grafana-audit-guard owns :3000 in this network
      # namespace and lets nothing through without the gateway's secret.
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3001"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: "X-Auth-User"
      GF_AUTH_PROXY_HEADER_PROPERTY: "username"
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_WHITELIST: 127.0.0.1
      # Readers only: Viewer, with Explore for their own queries; they
      # cannot save anything.
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_USERS_VIEWERS_CAN_EDIT: "true"
      # No copies of trail data or of reviewers' searches outside
      # loki-audit and its retention.
      GF_SNAPSHOTS_ENABLED: "false"
      GF_PUBLIC_DASHBOARDS_ENABLED: "false"
      GF_QUERY_HISTORY_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/audit-trail.json
    volumes:
      - ../grafana-audit/provisioning:/etc/grafana/provisioning:ro
      - ../grafana-audit/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-audit-data:/var/lib/grafana
    networks:
      audit-read:
      edge-net:
        aliases: [grafana-audit]
    depends_on:
      - loki-audit-read
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  # grafana-audit-guard — the only listener on :3000 in grafana-audit's
  # network namespace, so it answers for the `grafana-audit` alias on
  # edge-net. Fail-closed: 403 unless X-Edge-Secret equals
  # AUDIT_EDGE_SECRET, the value only the edge gateway sends; no access
  # log (the gateway's, in the audit lane, records every read).
  # Config: nginx/grafana-audit-guard.conf.template.
  grafana-audit-guard:
    <<: *hardened
    image: docker.io/nginxinc/nginx-unprivileged:1.31-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
    logging: *default-logging
    network_mode: "service:grafana-audit"
    read_only: true
    tmpfs:
      - /tmp:size=16m
      - /etc/nginx/conf.d:size=1m,mode=1777
    environment:
      EDGE_SECRET: ${AUDIT_EDGE_SECRET:?AUDIT_EDGE_SECRET must be set in .env (edge-plane's make secret)}
      EDGE_SECRET_REQUIRED: "1"
    volumes:
      - ../nginx/grafana-audit-guard.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ../scripts/edge_secret_check.sh:/docker-entrypoint.d/05-edge-secret-check.sh:ro
    depends_on:
      - grafana-audit
    restart: unless-stopped

  # Re-checks the hash chains in loki-audit and publishes the result as
  # metrics (:9105) for Prometheus. The Makefile's audit-verify,
  # audit-export and audit-anchor run one-shot commands of the same
  # service. Stdlib Python, mounted read-only; nothing is installed.
  audit-verifier:
    <<: *hardened
    image: docker.io/library/python:3.12.16-alpine3.24@sha256:e6dae589c1c05976188fd3bd019afd091445fc533ed2ea29001beddc7368a9c8
    logging: *default-logging
    # The image's `nobody`; audit-verifier-state is chowned to it by
    # `make volumes`.
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    entrypoint: ["python", "/app/verifier.py"]
    command: ["serve"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      AUDIT_LOKI_URL: http://loki-audit-read:3100
      AUDIT_STATE_DIR: /state
      AUDIT_VERIFY_INTERVAL: ${AUDIT_VERIFY_INTERVAL:-300}
      AUDIT_SILENCE_S: ${AUDIT_SILENCE_S:-300}
      AUDIT_RETENTION: ${AUDIT_RETENTION:-8760h}
    volumes:
      - ../audit:/app:ro
      - audit-verifier-state:/state
    networks:
      default:
      audit-read:
    depends_on:
      - loki-audit-read
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9105/metrics', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

##########################################################
# Volumes — external; created by `make volumes`. The ops
# volumes are destroyed only by the interactive `make nuke`
# (data-plane pattern); the audit volumes by no target at all —
# audit lines leave only through loki-audit's retention.
##########################################################
volumes:
  prometheus-data:
    external: true
  loki-data:
    external: true
  grafana-data:
    external: true
  alloy-data:
    external: true
  loki-audit-data:
    external: true
  grafana-audit-data:
    external: true
  audit-verifier-state:
    external: true
