# Alert rules — no notification channel by design (airgapped prod has no
# outbound path). They fire in Prometheus and appear read-only in
# Grafana -> Alerting -> Alert rules.
groups:
  - name: federation
    rules:
      - alert: ProbeDown
        expr: probe_success == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Endpoint {{ $labels.instance }} failing HTTP probe for 5m"
      - alert: ScrapeTargetDown
        expr: up == 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Scrape target {{ $labels.job }}/{{ $labels.instance }} down for 5m"
      - alert: ContainerRestartLooping
        expr: changes(container_start_time_seconds{name!=""}[1h]) > 3
        for: 0m
        labels: {severity: warning}
        annotations:
          summary: "Container {{ $labels.name }} restarted >3x in 1h"
  - name: host
    rules:
      - alert: HostDiskAlmostFull
        expr: >
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.15
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} >85% full"
      - alert: HostMemoryPressure
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Host memory available <10% for 10m"
  # GPU rules only produce data when the dcgm-exporter runs (`gpu` compose
  # profile). Memory threshold is 0.95/30m because vLLM deliberately
  # preallocates ~90% of VRAM — a 0.90 threshold would fire permanently.
  - name: gpu
    rules:
      - alert: GPUHighTemperature
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "GPU {{ $labels.gpu }} on {{ $labels.instance }} above 85C for 5m"
      - alert: GPUECCErrors
        expr: increase(DCGM_FI_DEV_ECC_DBE_VOL_TOTAL[1h]) > 0
        for: 0m
        labels: {severity: critical}
        annotations:
          summary: "GPU {{ $labels.gpu }} reported uncorrectable (double-bit) ECC errors in the last 1h"
      - alert: GPUMemoryAlmostFull
        expr: >
          DCGM_FI_DEV_FB_USED
          / (DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE) > 0.95
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: "GPU {{ $labels.gpu }} framebuffer >95% full for 30m"
