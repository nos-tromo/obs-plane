# Scrape targets reachable with ZERO member-repo changes.
# Not scrapeable in v1 (see README): Neo4j Community (no metrics endpoint),
# LiteLLM /metrics (enterprise-gated), vLLM backends (internal vllm-net only).
#
# The `apps` job below depends on companion, unmerged app-repo PRs
# (chorus#95, docint#341, Nextext#105, translator#71) that add
# prometheus-fastapi-instrumentator; see the job comment for detail.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: qdrant
    static_configs:
      - targets: ["qdrant:6333"]

  # FastAPI app backends — instrumented via prometheus-fastapi-instrumentator
  # in companion, unmerged PRs: chorus#95, docint#341, Nextext#105,
  # translator#71. Targets below are read down (scrapes will show `up == 0`)
  # until each companion PR merges and the corresponding backend ships
  # /metrics. Network membership per app:
  #   chorus-backend:8000     — data-net (also on inference-net)
  #   docint-backend:8000     — data-net (also on inference-net)
  #   nextext-backend:8000    — inference-net only
  #   translator-backend:8000 — inference-net only
  - job_name: apps
    static_configs:
      - targets:
          - chorus-backend:8000
          - docint-backend:8000
          - nextext-backend:8000
          - translator-backend:8000

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://vllm-router:4000/health/liveliness
          - http://neo4j:7474
          - http://qdrant:6333/healthz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
