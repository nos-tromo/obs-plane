# Scrape targets reachable with ZERO member-repo changes.
# Not scrapeable in v1 (see README): Neo4j Community (no metrics endpoint),
# LiteLLM /metrics (enterprise-gated).
#
# The `apps` job below scrapes the FastAPI backends, instrumented via
# prometheus-fastapi-instrumentator (chorus#95, docint#341, Nextext#105,
# translator#71 — merged); targets are up once each app deploys an image
# containing that change. See the job comment for network membership.
#
# The `vllm` job below targets chat/embed/rerank/asr by service name on
# inference-net. This depends on nos-tromo/vllm-service#67 (unmerged) to
# attach those backends to inference-net — until it merges these targets
# are DOWN (expected). clip/diarize/vad expose no /metrics endpoint and
# gliner (Ray Serve) is unconfirmed; all four stay unscraped (see README).
#
# The `dcgm` job below targets dcgm-exporter, which only runs when the `gpu`
# compose profile is enabled (COMPOSE_PROFILES=gpu in .env, GPU hosts only).
# With the profile off the target is DOWN (expected); `make health` excludes
# the dcgm job unless .env enables the profile.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: qdrant
    static_configs:
      - targets: ["qdrant:6333"]

  # Self-observation: Loki and Alloy are project-internal, same network as
  # prometheus, so no external-network membership is needed to scrape them.
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  # FastAPI app backends — instrumented via prometheus-fastapi-instrumentator
  # (chorus#95, docint#341, Nextext#105, translator#71 — merged). Targets
  # read down (`up == 0`) until each app deploys an image containing that
  # change. Network membership per app:
  #   chorus-backend:8000     — data-net (also on inference-net)
  #   docint-backend:8000     — data-net (also on inference-net)
  #   nextext-backend:8000    — inference-net only
  #   translator-backend:8000 — inference-net only
  - job_name: apps
    static_configs:
      - targets:
          - chorus-backend:8000
          - docint-backend:8000
          - nextext-backend:8000
          - translator-backend:8000

  - job_name: vllm
    static_configs:
      - targets: ["chat:8000", "embed:8000", "rerank:8000", "asr:8000"]

  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://vllm-router:4000/health/liveliness
          - http://neo4j:7474
          - http://qdrant:6333/healthz
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # NVIDIA GPU metrics — dcgm-exporter, project-internal, gated behind the
  # `gpu` compose profile. Expected down when the profile is off (see header).
  - job_name: dcgm
    static_configs:
      - targets: ["dcgm-exporter:9400"]
